name: Daily Fund NAV Update at 8PM CST

on:
  schedule:
    # 每天 UTC 12:00 = 台灣時間 20:00 (PM 8:00) 執行
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # 允許手動一鍵立即測試執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Lightweight Charts locally
        run: |
          curl -fSL "https://cloudflare.com" -o lightweight-charts.js
          head -c 50 lightweight-charts.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json lightweight-charts.js
          if ! git diff --quiet --staged; then
            git commit -m "Update fund data and chart library $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
