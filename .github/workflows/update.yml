name: Daily Fund NAV Update at 8PM CST

on:
  schedule:
    # 暫時改為每 5 分鐘執行一次，快速自動回補至 2010 年
    # （資料補滿後，請改回原本的 '0 12 * * 1-5' 每日晚上 8 點更新）
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止前一次回補還沒跑完，5 分鐘後又啟動新任務造成衝突
concurrency:
  group: daily-fund-nav-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Lightweight Charts locally from npm
        run: |
          touch .nojekyll
          npm install --no-save lightweight-charts@4.1.3
          cp node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js lightweight-charts.js
          rm -rf node_modules package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        timeout-minutes: 4
        run: python -u fetch.py


      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json lightweight-charts.js .nojekyll
          if ! git diff --quiet --staged; then
            git commit -m "Update fund data and chart library $(date +'%Y-%m-%d')"
            git pull --rebase -X theirs origin main
            git push
          fi
