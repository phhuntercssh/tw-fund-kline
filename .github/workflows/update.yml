name: Daily Fund NAV Update at 8PM CST

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Lightweight Charts locally from npm
        run: |
          touch .nojekyll
          npm install --no-save lightweight-charts@4.1.3
          cp node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js lightweight-charts.js
          rm -rf node_modules package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json lightweight-charts.js .nojekyll
          if ! git diff --quiet --staged; then
            git commit -m "Update fund data and chart library $(date +'%Y-%m-%d')"
            git pull --rebase -X theirs origin main
            git push
          fi
