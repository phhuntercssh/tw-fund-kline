<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主動型基金偽K線與大盤/台積電/00935超額報酬對比系統</title>
  <script src="./lightweight-charts.js?v=4.1.3-npm04"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #1e222d; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; }
    select, input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; padding: 6px 10px; border-radius: 4px; font-size: 14px; }
    button { background: #2962ff; border: none; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #1e53e5; }
    .chart-title { font-size: 15px; font-weight: bold; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .chart-box { width: 100%; border-radius: 8px; overflow: hidden; background: #1e222d; }
    #kline-chart { height: 340px; }
    #compare-chart { height: 300px; }
    #spread-chart { height: 300px; }
    .legend { font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
    .note { font-size: 12px; color: #787b86; }
    #statusBanner { display: none; background: #3b2322; color: #ff8a80; border: 1px solid #ef5350; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>

<div id="statusBanner"></div>

<div class="toolbar">
  <label>選擇基金：
    <select id="fundSelect">
      <option value="野村台灣運籌">野村台灣運籌</option>
      <option value="野村優質(累積)">野村優質(累積)</option>
      <option value="施羅德台灣樂活A">施羅德台灣樂活A</option>
    </select>
  </label>

  <label>K線週期：
    <select id="timeframeSelect">
      <option value="D">日 K（開=昨收 / 收=今收）</option>
      <option value="W">週 K（週一開 / 週五收）</option>
      <option value="M">月 K（月初開 / 月底收）</option>
    </select>
  </label>

  <label>起始日：<input type="date" id="startDate" value="2020-01-01" min="2010-01-01" /></label>
  <label>結束日：<input type="date" id="endDate" /></label>
  <button onclick="renderAll()">套用區間與週期</button>
  <span id="updateTime" class="note" style="margin-left:auto;"></span>
</div>

<div class="chart-title">
  <span id="klineTitle">基金淨值 K 線圖</span>
  <span class="note">紅漲綠跌（台股慣例）｜三張圖表時間軸與十字游標完全同步聯動</span>
</div>
<div id="kline-chart" class="chart-box"></div>

<div class="chart-title">
  <span>區間累計漲跌幅（%）對比 — 以設定「起始日」為 0% 基準</span>
  <div class="legend">
    <span style="color:#ff9800;">● 選定基金</span>
    <span style="color:#2962ff;">● 加權指數</span>
    <span style="color:#e91e63;">● 台積電(2330)</span>
    <span style="color:#00bcd4;">● 00935</span>
  </div>
</div>
<div id="compare-chart" class="chart-box"></div>

<div class="chart-title">
  <span>超額報酬差值（Alpha Spread %）— 數值大於 0% 代表基金跑贏對照標的</span>
  <div class="legend">
    <span style="color:#4caf50;">● 基金漲跌幅 − 大盤漲跌幅</span>
    <span style="color:#ab47bc;">● 基金漲跌幅 − 台積電漲跌幅</span>
    <span style="color:#ffd54f;">● 基金漲跌幅 − 00935漲跌幅</span>
  </div>
</div>
<div id="spread-chart" class="chart-box"></div>

<script>
let rawData = null;
let activeFund = '野村優質(累積)'; // 預設選中「野村優質(累積)」

let klineChart, compareChart, spreadChart;
let topFundSeriesMap = {};   // 最上方三檔基金走勢線
let lineSeriesMap = {};      // 中間績效百分比線
let spreadSeriesMap = {};    // 下方超額報酬價差線
let patternSeriesList = [];  // 白粗線與亮綠粗線標示序列

let currentMetricsMap = {};

// 三檔基金專屬配色（最上方圖表用）
const TOP_FUND_CONFIG = {
  '野村台灣運籌': { color: '#ff9800', priceScaleId: 'right', label: '野村台灣運籌 (右軸)' },
  '野村優質(累積)': { color: '#ffd54f', priceScaleId: 'right', label: '野村優質(累積) (右軸)' },
  '施羅德台灣樂活A': { color: '#ec407a', priceScaleId: 'left', label: '施羅德台灣樂活A (左軸)' }
};

// 中間與最下方圖表統一配色
const BENCH_COLORS = {
  fund: '#ff9800',
  '加權指數': '#2962ff',
  '台積電(2330)': '#e91e63',
  '00935': '#00bcd4'
};

document.getElementById('endDate').value = new Date().toISOString().split('T').at(0);

// 同步設定頁面下拉選單預設為「野村優質(累積)」
const fundSelectEl = document.getElementById('fundSelect');
if (fundSelectEl) {
  fundSelectEl.value = activeFund;
  fundSelectEl.addEventListener('change', (e) => {
    selectActiveFund(e.target.value);
  });
}

function showError(msg) {
  const banner = document.getElementById('statusBanner');
  banner.style.display = 'block';
  banner.innerHTML = msg;
}

// 切換目前焦點基金並即時更新下方兩張圖與按鈕狀態
function selectActiveFund(fundName) {
  if (!TOP_FUND_CONFIG[fundName]) return;
  activeFund = fundName;
  if (fundSelectEl) fundSelectEl.value = fundName;

  // 更新最上方三顆按鈕的選中樣式
  document.querySelectorAll('.top-fund-pill').forEach(btn => {
    const isSelected = btn.dataset.fund === fundName;
    const cfg = TOP_FUND_CONFIG[btn.dataset.fund];
    btn.style.background = isSelected ? cfg.color : 'rgba(43, 43, 67, 0.85)';
    btn.style.color = isSelected ? '#131722' : '#d1d4dc';
    btn.style.fontWeight = isSelected ? 'bold' : 'normal';
    btn.style.boxShadow = isSelected ? `0 0 10px ${cfg.color}66` : 'none';
  });

  // 突顯選中基金在最上方圖表的線條粗細
  for (const [fName, series] of Object.entries(topFundSeriesMap)) {
    series.applyOptions({ lineWidth: fName === activeFund ? 3 : 1.5 });
  }

  renderAll();
}

// 在最上方圖表標題列建立可點擊的三檔基金切換按鈕列
function buildTopFundSelectorBar() {
  const titleEl = document.getElementById('klineTitle');
  if (!titleEl || document.getElementById('topFundBar')) return;

  const bar = document.createElement('div');
  bar.id = 'topFundBar';
  bar.style.cssText = 'display:inline-flex; flex-wrap:wrap; gap:8px; margin-left:12px; vertical-align:middle;';

  for (const [fName, cfg] of Object.entries(TOP_FUND_CONFIG)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'top-fund-pill';
    btn.dataset.fund = fName;
    btn.innerText = `● ${cfg.label}`;
    btn.style.cssText = `
      border: 1px solid ${cfg.color}; border-radius: 14px; padding: 3px 11px;
      font-size: 12.5px; cursor: pointer; transition: all 0.15s ease;
    `;
    btn.onclick = () => selectActiveFund(fName);
    bar.appendChild(btn);
  }
  titleEl.parentNode.insertBefore(bar, titleEl.nextSibling);
}

function initCharts() {
  buildTopFundSelectorBar();

  const commonOptions = {
    layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
    timeScale: { timeVisible: false, borderColor: '#485c7b', rightOffset: 5 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
  };

  // 1. 最上方圖表：三檔基金淨值同框顯示（啟用左右雙座標軸）
  klineChart = LightweightCharts.createChart(document.getElementById('kline-chart'), {
    ...commonOptions,
    rightPriceScale: { visible: true, borderColor: '#485c7b' },
    leftPriceScale: { visible: true, borderColor: '#485c7b' }
  });

  for (const [fName, cfg] of Object.entries(TOP_FUND_CONFIG)) {
    topFundSeriesMap[fName] = klineChart.addLineSeries({
      color: cfg.color,
      priceScaleId: cfg.priceScaleId,
      lineWidth: fName === activeFund ? 3 : 1.5,
      title: fName
    });
  }

  // 支援直接在最上方圖表點擊任意一條基金線，自動切換下方兩圖
  klineChart.subscribeClick(param => {
    if (!param.point || !param.seriesData) return;
    let closestFund = null;
    let minPixelDist = Infinity;

    for (const [fName, series] of Object.entries(topFundSeriesMap)) {
      const pointData = param.seriesData.get(series);
      if (pointData && pointData.value !== undefined) {
        const coordY = series.priceToCoordinate(pointData.value);
        if (coordY !== null) {
          const dist = Math.abs(coordY - param.point.y);
          if (dist < minPixelDist) {
            minPixelDist = dist;
            closestFund = fName;
          }
        }
      }
    }
    if (closestFund && closestFund !== activeFund && minPixelDist <= 35) {
      selectActiveFund(closestFund);
    }
  });

  // 2. 中間圖表：績效百分比比較圖
  compareChart = LightweightCharts.createChart(document.getElementById('compare-chart'), {
    ...commonOptions,
    localization: { priceFormatter: p => p.toFixed(2) + '%' }
  });
  for (const [key, color] of Object.entries(BENCH_COLORS)) {
    lineSeriesMap[key] = compareChart.addLineSeries({ color, lineWidth: key === 'fund' ? 3 : 2 });
  }

  // 3. 最下方圖表：超額報酬價差圖（顏色與中間圖表完全一致）
  spreadChart = LightweightCharts.createChart(document.getElementById('spread-chart'), {
    ...commonOptions,
    localization: { priceFormatter: p => (p >= 0 ? '+' : '') + p.toFixed(2) + '%' }
  });
  const spreadColors = {
    'diff_twii': BENCH_COLORS['加權指數'],       // #2962ff
    'diff_2330': BENCH_COLORS['台積電(2330)'],   // #e91e63
    'diff_00935': BENCH_COLORS['00935']          // #00bcd4
  };
  for (const [key, color] of Object.entries(spreadColors)) {
    spreadSeriesMap[key] = spreadChart.addLineSeries({ color, lineWidth: 2 });
  }
  spreadSeriesMap['diff_twii'].createPriceLine({
    price: 0,
    color: '#787b86',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: '0% 基準'
  });

  // 三張圖表「放大縮小、左右拖曳」100% 同步
  const charts = [klineChart, compareChart, spreadChart];
  let isSyncingRange = false;

  charts.forEach((sourceChart, idx) => {
    sourceChart.timeScale().subscribeVisibleLogicalRangeChange(logicalRange => {
      if (isSyncingRange || !logicalRange) return;
      isSyncingRange = true;
      charts.forEach((targetChart, targetIdx) => {
        if (idx !== targetIdx) {
          targetChart.timeScale().setVisibleLogicalRange(logicalRange);
        }
      });
      isSyncingRange = false;
    });
  });

  // 滑鼠移動點上顯示三檔基金淨值與選中基金五項漲跌幅
  const tooltip = document.createElement('div');
  tooltip.style.cssText = `
    position: fixed; display: none; pointer-events: none; z-index: 9999;
    background: rgba(20, 24, 34, 0.95); color: #e0e3eb;
    border: 1px solid #485c7b; border-radius: 6px; padding: 10px 14px;
    font-size: 13px; line-height: 1.65; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    min-width: 235px;
  `;
  document.body.appendChild(tooltip);

  const fmtPctColor = (v) => {
    if (v === null || v === undefined || Number.isNaN(v)) return '<span style="color:#787b86;">--</span>';
    const color = v > 0 ? '#ef5350' : (v < 0 ? '#26a69a' : '#d1d4dc');
    return `<b style="color:${color};">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</b>`;
  };

  charts.forEach((sourceChart, sourceIdx) => {
    sourceChart.subscribeCrosshairMove(param => {
      if (!param.point || !param.time || param.point.x < 0 || param.point.y < 0) {
        tooltip.style.display = 'none';
        charts.forEach((c, i) => { if (i !== sourceIdx) c.clearCrosshairPosition(); });
        return;
      }

      const dateStr = typeof param.time === 'string'
        ? param.time
        : `${param.time.year}-${String(param.time.month).padStart(2, '0')}-${String(param.time.day).padStart(2, '0')}`;

      const m = currentMetricsMap[dateStr];
      if (!m) return;

      if (sourceIdx !== 0 && m.nav !== undefined && topFundSeriesMap[activeFund]) {
        klineChart.setCrosshairPosition(m.nav, dateStr, topFundSeriesMap[activeFund]);
      }
      if (sourceIdx !== 1 && m.cumPct !== undefined) {
        compareChart.setCrosshairPosition(m.cumPct, dateStr, lineSeriesMap['fund']);
      }
      if (sourceIdx !== 2 && m.spreadTwii !== undefined) {
        spreadChart.setCrosshairPosition(m.spreadTwii, dateStr, spreadSeriesMap['diff_twii']);
      }

      let navRowsHtml = '';
      for (const [fName, cfg] of Object.entries(TOP_FUND_CONFIG)) {
        const v = m.allNavs?.[fName];
        const isCur = fName === activeFund;
        navRowsHtml += `<div style="${isCur ? 'background:rgba(255,255,255,0.08); padding:0 4px; border-radius:3px;' : ''}">
          <span style="color:${cfg.color};">●</span> ${fName}：<b>${v !== undefined ? v.toFixed(2) : '--'}</b>
        </div>`;
      }

      let html = `
        <div style="font-weight:bold; font-size:13.5px; color:#fff; border-bottom:1px solid #363a45; padding-bottom:4px; margin-bottom:6px;">
          📅 ${dateStr}
        </div>
        <div style="margin-bottom:6px;">
          <div style="color:#9598a1; font-size:11.5px;">【三檔基金淨值（點擊可切換下方兩圖）】</div>
          ${navRowsHtml}
        </div>
        <div style="border-top:1px solid #363a45; padding-top:5px;">
          <div style="color:#9598a1; font-size:11.5px;">【${activeFund} 漲跌幅】</div>
          <div>(1) 單日漲跌幅：${fmtPctColor(m.d1)}</div>
          <div>(2) 5日漲跌幅：${fmtPctColor(m.d5)}</div>
          <div>(3) 30日漲跌幅：${fmtPctColor(m.d30)}</div>
          <div>(4) 60日漲跌幅：${fmtPctColor(m.d60)}</div>
          <div>(5) 90日漲跌幅：${fmtPctColor(m.d90)}</div>
        </div>
      `;

      if (m.patternTag) {
        html += `<div style="margin-top:6px; padding-top:5px; border-top:1px dashed #485c7b; font-size:12px;">${m.patternTag}</div>`;
      }

      tooltip.innerHTML = html;
      tooltip.style.display = 'block';

      const mouseX = param.sourceEvent ? param.sourceEvent.clientX : 0;
      const mouseY = param.sourceEvent ? param.sourceEvent.clientY : 0;
      const boxW = 260;
      const boxH = tooltip.offsetHeight || 290;
      const leftPos = (mouseX + boxW + 20 > window.innerWidth) ? (mouseX - boxW - 15) : (mouseX + 16);
      const topPos = (mouseY + boxH + 20 > window.innerHeight) ? Math.max(10, window.innerHeight - boxH - 15) : (mouseY + 16);
      tooltip.style.left = leftPos + 'px';
      tooltip.style.top = topPos + 'px';
    });
  });
}


  


function detectAndDrawPatterns(entries, targetPriceScaleId) {
  for (const s of patternSeriesList) {
    try { klineChart.removeSeries(s); } catch (e) {}
  }
  patternSeriesList = [];

  if (entries.length < 3) return {};

  const whiteSegments = [];
  const greenSegments = [];
  const tagMap = {};

  // 1. 白粗線：連漲波段（容許中斷 <= 4 次）後單日急跌 <= -5%
  for (let i = 1; i < entries.length; i++) {
    const prevNav = entries.at(i - 1).at(1);
    const currNav = entries.at(i).at(1);
    const dailyRet = ((currNav - prevNav) / prevNav) * 100;

    if (dailyRet <= -5.0) {
      let startIdx = i - 1;
      let downInterrupts = 0;
      const peakNav = prevNav;

      for (let j = i - 1; j >= 1; j--) {
        const dPrev = entries.at(j - 1).at(1);
        const dCurr = entries.at(j).at(1);
        if (dCurr >= dPrev) {
          startIdx = j - 1;
        } else {
          downInterrupts++;
          if (downInterrupts > 4 || dPrev < peakNav * 0.90) break;
          startIdx = j - 1;
        }
      }

      const startNav = entries.at(startIdx).at(1);
      const runUpPct = ((peakNav - startNav) / startNav) * 100;

      if (startIdx < i - 1 && runUpPct >= 2.0) {
        const seg = entries.slice(startIdx, i + 1).map(([d, v]) => ({ time: d, value: v }));
        whiteSegments.push(seg);
        const crashDate = entries.at(i).at(0);
        tagMap[crashDate] = `<span style="color:#ffffff;">⬜ <b>白粗線警示</b></span>：波段連漲 +${runUpPct.toFixed(1)}% 後急跌 <b>${dailyRet.toFixed(2)}%</b>`;
      }
    }
  }

  // 2. 亮綠粗線：連續下跌波段（容許中斷 <= 4 次），累計跌幅 <= -5%
  let idx = 0;
  while (idx < entries.length - 1) {
    if (entries.at(idx + 1).at(1) < entries.at(idx).at(1)) {
      let startIdx = idx;
      let endIdx = idx + 1;
      let upInterrupts = 0;
      const peakNav = entries.at(startIdx).at(1);
      let troughNav = entries.at(endIdx).at(1);

      for (let j = idx + 1; j < entries.length - 1; j++) {
        const nextNav = entries.at(j + 1).at(1);
        const currNav = entries.at(j).at(1);
        if (nextNav < currNav) {
          endIdx = j + 1;
          if (nextNav < troughNav) troughNav = nextNav;
        } else {
          upInterrupts++;
          if (upInterrupts > 4 || nextNav >= peakNav) break;
          endIdx = j + 1;
        }
      }

      while (endIdx > startIdx && entries.at(endIdx).at(1) > troughNav) {
        endIdx--;
      }

      const totalDropPct = ((troughNav - peakNav) / peakNav) * 100;
      if (endIdx > startIdx && totalDropPct <= -5.0) {
        const seg = entries.slice(startIdx, endIdx + 1).map(([d, v]) => ({ time: d, value: v }));
        greenSegments.push(seg);
        for (let k = startIdx; k <= endIdx; k++) {
          const dStr = entries.at(k).at(0);
          if (!tagMap[dStr]) {
            tagMap[dStr] = `<span style="color:#00e676;">🟩 <b>亮綠粗線區間</b></span>：波段累計下跌 <b>${totalDropPct.toFixed(2)}%</b>`;
          }
        }
        idx = endIdx + 1;
        continue;
      }
    }
    idx++;
  }

  for (const seg of greenSegments) {
    const s = klineChart.addLineSeries({
      color: '#00e676',
      priceScaleId: targetPriceScaleId,
      lineWidth: 4,
      crosshairMarkerVisible: false,
      lastValueVisible: false,
      priceLineVisible: false
    });
    s.setData(seg);
    patternSeriesList.push(s);
  }

  for (const seg of whiteSegments) {
    const s = klineChart.addLineSeries({
      color: '#ffffff',
      priceScaleId: targetPriceScaleId,
      lineWidth: 4,
      crosshairMarkerVisible: false,
      lastValueVisible: false,
      priceLineVisible: false
    });
    s.setData(seg);
    patternSeriesList.push(s);
  }

  return tagMap;
}

function toAlignedNavSeries(targetDict, alignedDates) {
  return alignedDates.map(d => {
    const val = targetDict[d];
    return val !== undefined ? { time: d, value: val } : { time: d };
  });
}

function toAlignedPctSeries(targetDict, alignedDates) {
  const validDates = alignedDates.filter(d => targetDict[d] !== undefined);
  if (validDates.length === 0) return [];
  const base = targetDict[validDates.at(0)];
  return alignedDates.map(d => {
    const val = targetDict[d];
    return val !== undefined
      ? { time: d, value: ((val - base) / base) * 100 }
      : { time: d };
  });
}

function toAlignedSpreadSeries(fundDict, benchDict, alignedDates) {
  const validDates = alignedDates.filter(d => fundDict[d] !== undefined && benchDict[d] !== undefined);
  if (validDates.length === 0) return [];
  const fundBase = fundDict[validDates.at(0)];
  const benchBase = benchDict[validDates.at(0)];
  return alignedDates.map(d => {
    if (fundDict[d] !== undefined && benchDict[d] !== undefined) {
      const fundPct = ((fundDict[d] - fundBase) / fundBase) * 100;
      const benchPct = ((benchDict[d] - benchBase) / benchBase) * 100;
      return { time: d, value: fundPct - benchPct };
    }
    return { time: d };
  });
}

function renderAll() {
  if (!rawData) return;
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;

  document.getElementById('klineTitle').innerText = `三檔基金淨值總覽（目前焦點：${activeFund}）`;

  // 收集三檔基金在區間內的所有聯集日期，作為三張圖的統一對齊時間軸
  const unionDateSet = new Set();
  for (const fName of Object.keys(TOP_FUND_CONFIG)) {
    const dObj = rawData.funds[fName] || {};
    for (const d of Object.keys(dObj)) {
      if (d >= start && d <= end) unionDateSet.add(d);
    }
  }
  const alignedDates = Array.from(unionDateSet).sort((a, b) => a.localeCompare(b));

  // 1. 繪製最上方三檔基金走勢線
  for (const fName of Object.keys(TOP_FUND_CONFIG)) {
    const fDict = rawData.funds[fName] || {};
    topFundSeriesMap[fName].setData(toAlignedNavSeries(fDict, alignedDates));
  }

  // 2. 針對目前選中的 activeFund 計算型態粗線與五項漲跌幅
  const activeDict = rawData.funds[activeFund] || {};
  const allSortedActive = Object.entries(activeDict).sort((a, b) => a.at(0).localeCompare(b.at(0)));
  const fullIndexMap = Object.fromEntries(allSortedActive.map(([d], idx) => [d, idx]));
  const filteredActiveEntries = allSortedActive.filter(([d]) => d >= start && d <= end);

  const activeScaleId = TOP_FUND_CONFIG[activeFund].priceScaleId;
  const patternTags = detectAndDrawPatterns(filteredActiveEntries, activeScaleId) || {};

  const fundPctList = toAlignedPctSeries(activeDict, alignedDates);
  const spTwiiList = toAlignedSpreadSeries(activeDict, rawData.benchmarks['加權指數'] || {}, alignedDates);

  currentMetricsMap = {};
  const calcRet = (fullIdx, offset) => {
    if (fullIdx === undefined || fullIdx - offset < 0) return null;
    const prev = allSortedActive.at(fullIdx - offset).at(1);
    const curr = allSortedActive.at(fullIdx).at(1);
    return ((curr - prev) / prev) * 100;
  };

  alignedDates.forEach((d, i) => {
    const fIdx = fullIndexMap[d];
    const allNavs = {};
    for (const fName of Object.keys(TOP_FUND_CONFIG)) {
      allNavs[fName] = rawData.funds[fName]?.[d];
    }
    currentMetricsMap[d] = {
      nav: activeDict[d],
      allNavs,
      d1: calcRet(fIdx, 1),
      d5: calcRet(fIdx, 5),
      d30: calcRet(fIdx, 30),
      d60: calcRet(fIdx, 60),
      d90: calcRet(fIdx, 90),
      cumPct: fundPctList.at(i)?.value,
      spreadTwii: spTwiiList.at(i)?.value,
      patternTag: patternTags[d] || ''
    };
  });

  // 3. 更新中間圖表（績效比較）
  lineSeriesMap['fund'].setData(fundPctList);
  for (const bName of ['加權指數', '台積電(2330)', '00935']) {
    lineSeriesMap[bName].setData(toAlignedPctSeries(rawData.benchmarks[bName] || {}, alignedDates));
  }

  // 4. 更新最下方圖表（超額報酬價差，配色與中間圖一致）
  spreadSeriesMap['diff_twii'].setData(spTwiiList);
  spreadSeriesMap['diff_2330'].setData(toAlignedSpreadSeries(activeDict, rawData.benchmarks['台積電(2330)'] || {}, alignedDates));
  spreadSeriesMap['diff_00935'].setData(toAlignedSpreadSeries(activeDict, rawData.benchmarks['00935'] || {}, alignedDates));

  klineChart.timeScale().fitContent();
  compareChart.timeScale().fitContent();
  spreadChart.timeScale().fitContent();
}

async function boot() {
  initCharts();
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (!res.ok) {
      showError('⚠️ 尚未找到 <b>data.json</b> 資料檔！請先到 GitHub 倉庫的 <b>Actions</b> 分頁手動執行一次 <b>Run workflow</b> 產生數據，再重新整理此網頁。');
      return;
    }
    rawData = await res.json();
    document.getElementById('updateTime').innerText = '最後更新：' + rawData.updated_at;
    selectActiveFund('野村優質(累積)');
  } catch (err) {
    showError('⚠️ 載入資料發生錯誤：' + err.message);
  }
}

boot();
</script>
