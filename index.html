<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣主動式基金 vs 大盤／台積電／00935 相對強弱分析</title>
  <script src="./lightweight-charts.js"
          onerror="this.onerror=null;this.src='https://cloudflare.com';"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 20px;
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: #1e222d;
      border: 1px solid #2b2b43;
      border-radius: 8px;
    }
    .note {
      font-size: 12px;
      color: #848e9c;
    }
    #statusBanner {
      display: none;
      padding: 12px 16px;
      margin-bottom: 14px;
      background: rgba(239, 83, 80, 0.15);
      border: 1px solid #ef5350;
      border-radius: 6px;
      color: #ff8a80;
      font-size: 13.5px;
    }
    .chart-card {
      background: #1e222d;
      border: 1px solid #2b2b43;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .chart-title {
      font-weight: bold;
      font-size: 15px;
      color: #ffffff;
    }
    .legend-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12.5px;
    }
    .chart-box {
      width: 100%;
      height: 310px;
      position: relative;
    }
  </style>
</head>
<body>

  <div id="statusBanner"></div>

  <div class="header-bar">
    <div id="topFundBar" style="display:inline-flex; flex-wrap:wrap; gap:8px;"></div>
    <div style="width:1px; height:20px; background:#485c7b; margin:0 2px;"></div>
    <div id="dateQuickBar" style="display:inline-flex; flex-wrap:wrap; gap:6px;"></div>
    <span id="updateTime" class="note" style="margin-left:auto;">載入中...</span>
  </div>

  <!-- 第一圖：相對強弱比值指數（Base = 100，放大自動重算基準日） -->
  <div class="chart-card">
    <div class="chart-header">
      <div id="ratioTitle" class="chart-title">相對強弱比值指數（基準日 = 100，放大圖表自動以畫面起點重算）</div>
      <div class="legend-group">
        <span style="color:#00bcd4;">● 線 A（基金 ÷ 00935）</span>
        <span style="color:#e91e63;">● 線 B（基金 ÷ 台積電）</span>
        <span style="color:#2962ff;">● 線 C（基金 ÷ 加權指數）</span>
        <span id="ratioBaseBadge" style="color:#ffd54f; font-weight:bold;">[基準日：--]</span>
      </div>
    </div>
    <div id="ratio-chart" class="chart-box"></div>
  </div>

  <!-- 第二圖：三檔基金淨值總覽（雙座標軸 + 左上角淨值標示框 + 綠白型態粗線） -->
  <div class="chart-card">
    <div class="chart-header">
      <div id="klineTitle" class="chart-title">三檔基金淨值總覽</div>
      <div class="legend-group">
        <span style="color:#00e676;">━ 波段下跌 ≥ 5%</span>
        <span style="color:#ffffff;">━ 連漲後單日急跌 ≥ 5%</span>
      </div>
    </div>
    <div id="kline-chart" class="chart-box">
      <div id="leftFundLegendOverlay" style="position:absolute; top:8px; left:68px; z-index:20; display:flex; flex-direction:column; gap:4px; pointer-events:none;"></div>
    </div>
  </div>

  <!-- 第三圖：圖一三線之 60 日滾動 Z-Score -->
  <div class="chart-card">
    <div class="chart-header">
      <div id="zscoreTitle" class="chart-title">相對強弱比值 — 60 日滾動 Z-Score（±2σ 偏離度指標）</div>
      <div class="legend-group">
        <span style="color:#00bcd4;">● Z-Score A（÷ 00935）</span>
        <span style="color:#e91e63;">● Z-Score B（÷ 台積電）</span>
        <span style="color:#2962ff;">● Z-Score C（÷ 加權指數）</span>
      </div>
    </div>
    <div id="zscore-chart" class="chart-box"></div>
  </div>





<script>
let rawData = null;
let activeFund = '野村優質(累積)';

let ratioChart, klineChart, zscoreChart;
let ratioSeriesMap = {};
let topFundSeriesMap = {};
let zscoreSeriesMap = {};
let patternSeriesList = [];

let currentMetricsMap = {};
let currentAlignedDates = [];
let currentRawRatioMaps = { ratio_00935: {}, ratio_2330: {}, ratio_twii: {} };

const TOP_FUND_CONFIG = {
  '野村台灣運籌': { color: '#ff9800', priceScaleId: 'right', label: '野村台灣運籌 (右軸)' },
  '野村優質(累積)': { color: '#ffd54f', priceScaleId: 'right', label: '野村優質(累積) (右軸)' },
  '施羅德台灣樂活A': { color: '#ec407a', priceScaleId: 'left', label: '施羅德台灣樂活A (左軸)' }
};

const BENCH_COLORS = {
  fund: '#ff9800',
  '加權指數': '#2962ff',
  '台積電(2330)': '#e91e63',
  '00935': '#00bcd4'
};

const formatDateLocal = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const nowDateObj = new Date();
let currentEndDate = formatDateLocal(nowDateObj);
let currentStartDate = formatDateLocal(new Date(nowDateObj.getFullYear() - 1, nowDateObj.getMonth(), nowDateObj.getDate()));

function showError(msg) {
  const banner = document.getElementById('statusBanner');
  if (banner) {
    banner.style.display = 'block';
    banner.innerHTML = msg;
  }
}

function updateLeftFundLegendOverlay(latestValuesMap) {
  const overlay = document.getElementById('leftFundLegendOverlay');
  if (!overlay) return;

  let html = '';
  for (const [fName, cfg] of Object.entries(TOP_FUND_CONFIG)) {
    const val = latestValuesMap[fName];
    const valText = (typeof val === 'number' && Number.isFinite(val)) ? val.toFixed(2) : '--';
    const isCur = fName === activeFund;
    html += `
      <div style="
        background: ${cfg.color}; color: #131722;
        font-weight: bold; font-size: 12px;
        padding: 2px 8px; border-radius: 3px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.45);
        opacity: ${isCur ? '1' : '0.88'};
        border: ${isCur ? '1.5px solid #ffffff' : '1px solid transparent'};
        white-space: nowrap;
      ">
        ${fName}：${valText}
      </div>
    `;
  }
  overlay.innerHTML = html;
}

function buildCombinedControlBar() {
  const fundBar = document.getElementById('topFundBar');
  const dateBar = document.getElementById('dateQuickBar');
  if (!fundBar || !dateBar) return;

  fundBar.innerHTML = '';
  for (const [fName, cfg] of Object.entries(TOP_FUND_CONFIG)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'top-fund-pill';
    btn.dataset.fund = fName;
    btn.innerText = `● ${cfg.label}`;
    btn.style.cssText = `
      border: 1px solid ${cfg.color}; border-radius: 14px; padding: 4px 12px;
      font-size: 12.5px; cursor: pointer; transition: all 0.15s ease;
    `;
    btn.onclick = () => selectActiveFund(fName);
    fundBar.appendChild(btn);
  }

  dateBar.innerHTML = '';
  const presets = [
    { id: '30D', label: '近30天', days: 30 },
    { id: '3M', label: '近3個月', months: 3 },
    { id: '1Y', label: '近1年', months: 12 },
    { id: '3Y', label: '近3年', months: 36 },
    { id: 'ALL', label: '全部', months: null }
  ];

  const updateDateBtnStyle = (activeId) => {
    dateBar.querySelectorAll('button').forEach(b => {
      const isSelected = b.dataset.preset === activeId;
      b.style.background = isSelected ? '#2962ff' : '#2a2e39';
      b.style.color = isSelected ? '#ffffff' : '#d1d4dc';
      b.style.borderColor = isSelected ? '#2962ff' : '#485c7b';
      b.style.fontWeight = isSelected ? 'bold' : 'normal';
    });
  };

  presets.forEach(p => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.preset = p.id;
    btn.innerText = p.label;
    btn.style.cssText = `
      border: 1px solid #485c7b; border-radius: 4px; padding: 4px 10px;
      font-size: 12.5px; cursor: pointer; transition: all 0.15s ease;
    `;
    btn.onclick = () => {
      const now = new Date();
      currentEndDate = formatDateLocal(now);

      if (p.days) {
        const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() - p.days);
        currentStartDate = formatDateLocal(target);
      } else if (p.months === null) {
        let minDate = '2010-01-04';
        if (rawData && rawData.funds) {
          const allFirstDates = Object.values(rawData.funds)
            .map(dObj => Object.keys(dObj).sort().at(0))
            .filter(Boolean);
          if (allFirstDates.length > 0) minDate = allFirstDates.sort().at(0);
        }
        currentStartDate = minDate;
      } else {
        const target = new Date(now.getFullYear(), now.getMonth() - p.months, now.getDate());
        currentStartDate = formatDateLocal(target);
      }

      updateDateBtnStyle(p.id);
      renderAll();
    };
    dateBar.appendChild(btn);
  });

  updateDateBtnStyle('1Y');
}

function selectActiveFund(fundName) {
  if (!TOP_FUND_CONFIG[fundName]) return;
  activeFund = fundName;

  document.querySelectorAll('.top-fund-pill').forEach(btn => {
    const isSelected = btn.dataset.fund === fundName;
    const cfg = TOP_FUND_CONFIG[btn.dataset.fund];
    btn.style.background = isSelected ? cfg.color : 'rgba(43, 43, 67, 0.85)';
    btn.style.color = isSelected ? '#131722' : '#d1d4dc';
    btn.style.fontWeight = isSelected ? 'bold' : 'normal';
    btn.style.boxShadow = isSelected ? `0 0 10px ${cfg.color}66` : 'none';
  });

  for (const [fName, series] of Object.entries(topFundSeriesMap)) {
    series.applyOptions({ lineWidth: fName === activeFund ? 3 : 1.5 });
  }

  renderAll();
}







  
function recalculateRatioChartForVisibleRange(logicalRange) {
  if (!currentAlignedDates || currentAlignedDates.length === 0) return;

  let startIdx = 0;
  if (logicalRange && typeof logicalRange.from === 'number') {
    startIdx = Math.max(0, Math.min(currentAlignedDates.length - 1, Math.floor(logicalRange.from)));
  }

  let baseDate = null;
  let baseA = null, baseB = null, baseC = null;

  for (let i = startIdx; i < currentAlignedDates.length; i++) {
    const d = currentAlignedDates.at(i);
    const rA = currentRawRatioMaps.ratio_00935[d];
    const rB = currentRawRatioMaps.ratio_2330[d];
    const rC = currentRawRatioMaps.ratio_twii[d];
    if (rA !== undefined && rB !== undefined && rC !== undefined) {
      baseDate = d;
      baseA = rA;
      baseB = rB;
      baseC = rC;
      break;
    }
  }

  const badgeEl = document.getElementById('ratioBaseBadge');
  if (!baseDate) {
    if (badgeEl) badgeEl.innerText = '[基準日：無資料]';
    return;
  }
  if (badgeEl) badgeEl.innerText = `[基準日：${baseDate} = 100]`;

  const seriesA = [], seriesB = [], seriesC = [];
  for (const d of currentAlignedDates) {
    const rA = currentRawRatioMaps.ratio_00935[d];
    const rB = currentRawRatioMaps.ratio_2330[d];
    const rC = currentRawRatioMaps.ratio_twii[d];

    const normA = rA !== undefined ? (rA / baseA) * 100 : undefined;
    const normB = rB !== undefined ? (rB / baseB) * 100 : undefined;
    const normC = rC !== undefined ? (rC / baseC) * 100 : undefined;

    seriesA.push(normA !== undefined ? { time: d, value: normA } : { time: d });
    seriesB.push(normB !== undefined ? { time: d, value: normB } : { time: d });
    seriesC.push(normC !== undefined ? { time: d, value: normC } : { time: d });

    if (currentMetricsMap[d]) {
      currentMetricsMap[d].ratioA = normA;
      currentMetricsMap[d].ratioB = normB;
      currentMetricsMap[d].ratioC = normC;
    }
  }

  ratioSeriesMap['ratio_00935'].setData(seriesA);
  ratioSeriesMap['ratio_2330'].setData(seriesB);
  ratioSeriesMap['ratio_twii'].setData(seriesC);
}

function initCharts() {
  buildCombinedControlBar();

  const commonOptions = {
    layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
    timeScale: {
      timeVisible: false,
      borderColor: '#485c7b',
      rightOffset: 0,
      fixRightEdge: true,
      fixLeftEdge: true
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
  };

  // 第一圖：相對強弱比值指數（Base = 100）
  ratioChart = LightweightCharts.createChart(document.getElementById('ratio-chart'), {
    ...commonOptions,
    localization: { priceFormatter: p => p.toFixed(1) }
  });
  ratioSeriesMap['ratio_00935'] = ratioChart.addLineSeries({ color: BENCH_COLORS['00935'], lineWidth: 2 });
  ratioSeriesMap['ratio_2330'] = ratioChart.addLineSeries({ color: BENCH_COLORS['台積電(2330)'], lineWidth: 2 });
  ratioSeriesMap['ratio_twii'] = ratioChart.addLineSeries({ color: BENCH_COLORS['加權指數'], lineWidth: 2 });
  ratioSeriesMap['ratio_twii'].createPriceLine({
    price: 100,
    color: '#ffd54f',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: ''
  });

  // 第二圖：三檔基金淨值總覽
  klineChart = LightweightCharts.createChart(document.getElementById('kline-chart'), {
    ...commonOptions,
    rightPriceScale: { visible: true, borderColor: '#485c7b' },
    leftPriceScale: { visible: true, borderColor: '#485c7b' }
  });
  for (const [fName, cfg] of Object.entries(TOP_FUND_CONFIG)) {
    topFundSeriesMap[fName] = klineChart.addLineSeries({
      color: cfg.color,
      priceScaleId: cfg.priceScaleId,
      lineWidth: fName === activeFund ? 3 : 1.5,
      title: ''
    });
  }

  klineChart.subscribeClick(param => {
    if (!param.point || !param.seriesData) return;
    let closestFund = null;
    let minPixelDist = Infinity;
    for (const [fName, series] of Object.entries(topFundSeriesMap)) {
      const pointData = param.seriesData.get(series);
      if (pointData && pointData.value !== undefined) {
        const coordY = series.priceToCoordinate(pointData.value);
        if (coordY !== null) {
          const dist = Math.abs(coordY - param.point.y);
          if (dist < minPixelDist) {
            minPixelDist = dist;
            closestFund = fName;
          }
        }
      }
    }
    if (closestFund && closestFund !== activeFund && minPixelDist <= 35) {
      selectActiveFund(closestFund);
    }
  });

  // 第三圖：圖一三線之 60 日滾動 Z-Score
  zscoreChart = LightweightCharts.createChart(document.getElementById('zscore-chart'), {
    ...commonOptions,
    localization: { priceFormatter: p => (p >= 0 ? '+' : '') + p.toFixed(2) }
  });
  zscoreSeriesMap['z_00935'] = zscoreChart.addLineSeries({ color: BENCH_COLORS['00935'], lineWidth: 2 });
  zscoreSeriesMap['z_2330'] = zscoreChart.addLineSeries({ color: BENCH_COLORS['台積電(2330)'], lineWidth: 2 });
  zscoreSeriesMap['z_twii'] = zscoreChart.addLineSeries({ color: BENCH_COLORS['加權指數'], lineWidth: 2 });

  // Z-Score 參考基準線：+2.0、0.0、-2.0
  zscoreSeriesMap['z_twii'].createPriceLine({
    price: 2.0,
    color: '#ef5350',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: '+2σ'
  });
  zscoreSeriesMap['z_twii'].createPriceLine({
    price: 0,
    color: '#787b86',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: '0'
  });
  zscoreSeriesMap['z_twii'].createPriceLine({
    price: -2.0,
    color: '#26a69a',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: '-2σ'
  });











  const charts = [ratioChart, klineChart, zscoreChart];
  let isSyncingRange = false;

  charts.forEach((sourceChart) => {
    sourceChart.timeScale().subscribeVisibleLogicalRangeChange(logicalRange => {
      if (isSyncingRange || !logicalRange || currentAlignedDates.length === 0) return;
      isSyncingRange = true;

      const lastIdx = currentAlignedDates.length - 1;
      const span = Math.max(5, logicalRange.to - logicalRange.from);
      const clampedRange = {
        from: Math.max(0, lastIdx - span),
        to: lastIdx
      };

      charts.forEach((targetChart) => {
        targetChart.timeScale().setVisibleLogicalRange(clampedRange);
      });

      recalculateRatioChartForVisibleRange(clampedRange);
      isSyncingRange = false;
    });
  });

  const tooltip = document.createElement('div');
  tooltip.style.cssText = `
    position: fixed; display: none; pointer-events: none; z-index: 9999;
    background: rgba(18, 22, 31, 0.96); color: #e0e3eb;
    border: 1px solid #485c7b; border-radius: 7px; padding: 10px 12px;
    font-size: 12.5px; line-height: 1.5; box-shadow: 0 8px 22px rgba(0,0,0,0.55);
  `;
  document.body.appendChild(tooltip);

  const COL_KEYS = ['運籌', '優質', '樂活', '935'];
  const PERIOD_ROWS = [
    { key: 'd1', label: '單日' },
    { key: 'd5', label: '5日' },
    { key: 'd30', label: '30日' },
    { key: 'd60', label: '60日' },
    { key: 'd90', label: '90日' },
    { key: 'd120', label: '120日' }
  ];

  const safeSyncCrosshair = (chartObj, val, dateStr, seriesObj) => {
    if (!chartObj || !seriesObj) return;
    if (typeof val === 'number' && Number.isFinite(val)) {
      try {
        chartObj.setCrosshairPosition(val, dateStr, seriesObj);
      } catch (e) {}
    } else {
      try {
        chartObj.clearCrosshairPosition();
      } catch (e) {}
    }
  };

  const fmtZ = (z) => {
    if (typeof z !== 'number' || !Number.isFinite(z)) return '--';
    const c = z >= 2 ? '#ef5350' : (z <= -2 ? '#26a69a' : '#e0e3eb');
    return `<b style="color:${c};">${z >= 0 ? '+' : ''}${z.toFixed(2)}</b>`;
  };

  charts.forEach((sourceChart, sourceIdx) => {
    sourceChart.subscribeCrosshairMove(param => {
      if (!param.point || !param.time || param.point.x < 0 || param.point.y < 0) {
        tooltip.style.display = 'none';
        charts.forEach((c, i) => { if (i !== sourceIdx) c.clearCrosshairPosition(); });
        return;
      }

      const dateStr = typeof param.time === 'string'
        ? param.time
        : `${param.time.year}-${String(param.time.month).padStart(2, '0')}-${String(param.time.day).padStart(2, '0')}`;

      const m = currentMetricsMap[dateStr];
      if (!m) return;

      if (sourceIdx !== 0) safeSyncCrosshair(ratioChart, m.ratioC, dateStr, ratioSeriesMap['ratio_twii']);
      if (sourceIdx !== 1) safeSyncCrosshair(klineChart, m.nav, dateStr, topFundSeriesMap[activeFund]);
      if (sourceIdx !== 2) safeSyncCrosshair(zscoreChart, m.zTwii, dateStr, zscoreSeriesMap['z_twii']);

      const comp = m.comp || {};

      const priceCells = COL_KEYS.map(k => {
        const p = comp[k]?.price;
        return `<td style="padding:3px 7px; text-align:right; color:#b2b5be; font-size:11.5px; border-bottom:1px solid #363a45;">
          ${typeof p === 'number' && Number.isFinite(p) ? p.toFixed(2) : '--'}
        </td>`;
      }).join('');

      const periodRowsHtml = PERIOD_ROWS.map(row => {
        let maxVal = -Infinity;
        COL_KEYS.forEach(k => {
          const val = comp[k]?.[row.key];
          if (typeof val === 'number' && Number.isFinite(val) && val > maxVal) {
            maxVal = val;
          }
        });

        const cells = COL_KEYS.map(k => {
          const val = comp[k]?.[row.key];
          if (typeof val !== 'number' || !Number.isFinite(val)) {
            return `<td style="padding:4px 7px; text-align:right; color:#787b86;">--</td>`;
          }
          const isFirst = (maxVal > -Infinity) && (Math.abs(val - maxVal) < 1e-6);
          const textColor = val > 0 ? '#ef5350' : (val < 0 ? '#26a69a' : '#d1d4dc');
          const boxStyle = isFirst
            ? 'border:1.5px solid #ffd54f; border-radius:4px; padding:1px 5px; background:rgba(255,213,79,0.14); display:inline-block;'
            : 'padding:1px 5px; display:inline-block;';

          return `<td style="padding:3px 5px; text-align:right;">
            <span style="${boxStyle} color:${textColor}; font-weight:bold;">
              ${val >= 0 ? '+' : ''}${val.toFixed(2)}%
            </span>
          </td>`;
        }).join('');

        return `<tr>
          <td style="padding:3px 8px 3px 2px; color:#d1d4dc; font-weight:bold; white-space:nowrap;">${row.label}</td>
          ${cells}
        </tr>`;
      }).join('');

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #363a45; padding-bottom:5px; margin-bottom:6px;">
          <span style="font-weight:bold; font-size:13.5px; color:#fff;">📅 ${dateStr}</span>
          <span style="font-size:11px; color:#ffd54f; border:1px solid #ffd54f; border-radius:3px; padding:0 5px;">黃框 = 第一名</span>
        </div>
        <table style="border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums;">
          <thead>
            <tr style="border-bottom:1px solid #363a45;">
              <th style="padding:3px 8px 3px 2px; text-align:left; color:#9598a1; font-weight:normal;">週期</th>
              <th style="padding:3px 7px; text-align:right; color:#ff9800;">運籌</th>
              <th style="padding:3px 7px; text-align:right; color:#ffd54f;">優質</th>
              <th style="padding:3px 7px; text-align:right; color:#ec407a;">樂活</th>
              <th style="padding:3px 7px; text-align:right; color:#00bcd4;">935</th>
            </tr>
            <tr>
              <td style="padding:3px 8px 3px 2px; color:#9598a1; font-size:11.5px; border-bottom:1px solid #363a45;">淨值/價</td>
              ${priceCells}
            </tr>
          </thead>
          <tbody>
            ${periodRowsHtml}
          </tbody>
        </table>
        <div style="margin-top:6px; padding-top:5px; border-top:1px solid #363a45; font-size:11.5px; display:flex; justify-content:space-between; gap:8px;">
          <span><span style="color:#00bcd4;">●</span> 935 Z:${fmtZ(m.z00935)}</span>
          <span><span style="color:#e91e63;">●</span> 台積 Z:${fmtZ(m.z2330)}</span>
          <span><span style="color:#2962ff;">●</span> 大盤 Z:${fmtZ(m.zTwii)}</span>
        </div>
      `;

      if (m.patternTag) {
        html += `<div style="margin-top:5px; padding-top:5px; border-top:1px dashed #485c7b; font-size:11.5px;">${m.patternTag}</div>`;
      }

      tooltip.innerHTML = html;
      tooltip.style.display = 'block';

      const mouseX = param.sourceEvent ? param.sourceEvent.clientX : 0;
      const mouseY = param.sourceEvent ? param.sourceEvent.clientY : 0;
      const boxW = tooltip.offsetWidth || 355;
      const boxH = tooltip.offsetHeight || 295;
      const leftPos = (mouseX + boxW + 20 > window.innerWidth) ? (mouseX - boxW - 15) : (mouseX + 16);
      const topPos = (mouseY + boxH + 20 > window.innerHeight) ? Math.max(10, window.innerHeight - boxH - 15) : (mouseY + 16);
      tooltip.style.left = leftPos + 'px';
      tooltip.style.top = topPos + 'px';
    });
  });

  window.addEventListener('resize', () => {
    [ratioChart, klineChart, zscoreChart].forEach(c => {
      if (c && c.chartElement()) {
        c.applyOptions({ width: c.chartElement().parentElement.clientWidth });
      }
    });
  });
}





function detectAndDrawPatterns(entries, targetPriceScaleId) {
  for (const s of patternSeriesList) {
    try { klineChart.removeSeries(s); } catch (e) {}
  }
  patternSeriesList = [];

  if (entries.length < 3) return {};

  const whiteSegments = [];
  const greenSegments = [];
  const tagMap = {};

  for (let i = 1; i < entries.length; i++) {
    const prevNav = entries.at(i - 1).at(1);
    const currNav = entries.at(i).at(1);
    const dailyRet = ((currNav - prevNav) / prevNav) * 100;

    if (dailyRet <= -5.0) {
      let startIdx = i - 1;
      let downInterrupts = 0;
      const peakNav = prevNav;

      for (let j = i - 1; j >= 1; j--) {
        const dPrev = entries.at(j - 1).at(1);
        const dCurr = entries.at(j).at(1);
        if (dCurr >= dPrev) {
          startIdx = j - 1;
        } else {
          downInterrupts++;
          if (downInterrupts > 4 || dPrev < peakNav * 0.90) break;
          startIdx = j - 1;
        }
      }

      const startNav = entries.at(startIdx).at(1);
      const runUpPct = ((peakNav - startNav) / startNav) * 100;

      if (startIdx < i - 1 && runUpPct >= 2.0) {
        const seg = entries.slice(startIdx, i + 1).map(([d, v]) => ({ time: d, value: v }));
        whiteSegments.push(seg);
        const crashDate = entries.at(i).at(0);
        tagMap[crashDate] = `<span style="color:#ffffff;">⬜ <b>白粗線警示</b></span>：波段連漲 +${runUpPct.toFixed(1)}% 後急跌 <b>${dailyRet.toFixed(2)}%</b>`;
      }
    }
  }

  let idx = 0;
  while (idx < entries.length - 1) {
    if (entries.at(idx + 1).at(1) < entries.at(idx).at(1)) {
      let startIdx = idx;
      let endIdx = idx + 1;
      let upInterrupts = 0;
      const peakNav = entries.at(startIdx).at(1);
      let troughNav = entries.at(endIdx).at(1);

      for (let j = idx + 1; j < entries.length - 1; j++) {
        const nextNav = entries.at(j + 1).at(1);
        const currNav = entries.at(j).at(1);
        if (nextNav < currNav) {
          endIdx = j + 1;
          if (nextNav < troughNav) troughNav = nextNav;
        } else {
          upInterrupts++;
          if (upInterrupts > 4 || nextNav >= peakNav) break;
          endIdx = j + 1;
        }
      }

      while (endIdx > startIdx && entries.at(endIdx).at(1) > troughNav) {
        endIdx--;
      }

      const totalDropPct = ((troughNav - peakNav) / peakNav) * 100;
      if (endIdx > startIdx && totalDropPct <= -5.0) {
        const seg = entries.slice(startIdx, endIdx + 1).map(([d, v]) => ({ time: d, value: v }));
        greenSegments.push(seg);
        for (let k = startIdx; k <= endIdx; k++) {
          const dStr = entries.at(k).at(0);
          if (!tagMap[dStr]) {
            tagMap[dStr] = `<span style="color:#00e676;">🟩 <b>亮綠粗線區間</b></span>：波段累計下跌 <b>${totalDropPct.toFixed(2)}%</b>`;
          }
        }
        idx = endIdx + 1;
        continue;
      }
    }
    idx++;
  }

  for (const seg of greenSegments) {
    const s = klineChart.addLineSeries({
      color: '#00e676',
      priceScaleId: targetPriceScaleId,
      lineWidth: 4,
      crosshairMarkerVisible: false,
      lastValueVisible: false,
      priceLineVisible: false
    });
    s.setData(seg);
    patternSeriesList.push(s);
  }

  for (const seg of whiteSegments) {
    const s = klineChart.addLineSeries({
      color: '#ffffff',
      priceScaleId: targetPriceScaleId,
      lineWidth: 4,
      crosshairMarkerVisible: false,
      lastValueVisible: false,
      priceLineVisible: false
    });
    s.setData(seg);
    patternSeriesList.push(s);
  }

  return tagMap;
}

function toAlignedNavSeries(targetDict, alignedDates) {
  return alignedDates.map(d => {
    const val = targetDict[d];
    return val !== undefined ? { time: d, value: val } : { time: d };
  });
}

function buildMultiAssetReturnLookup(dictObj) {
  const sortedEntries = Object.entries(dictObj || {}).sort((a, b) => a.at(0).localeCompare(b.at(0)));
  const lookup = {};
  const offsets = [
    { key: 'd1', n: 1 },
    { key: 'd5', n: 5 },
    { key: 'd30', n: 30 },
    { key: 'd60', n: 60 },
    { key: 'd90', n: 90 },
    { key: 'd120', n: 120 }
  ];

  sortedEntries.forEach(([dateStr, currVal], idx) => {
    const item = { price: currVal };
    offsets.forEach(({ key, n }) => {
      if (idx - n >= 0) {
        const prevVal = sortedEntries.at(idx - n).at(1);
        item[key] = prevVal > 0 ? ((currVal - prevVal) / prevVal) * 100 : null;
      } else {
        item[key] = null;
      }
    });
    lookup[dateStr] = item;
  });
  return lookup;
}

// 計算完整歷史的 60 日滾動 Z-Score（利用全歷史資料計算，即使切到「近30天」也能準確算出前60日Z-Score）
function buildRollingZScoreLookup(fundDict, benchDict, windowSize = 60) {
  const commonDates = Object.keys(fundDict || {})
    .filter(d => typeof fundDict[d] === 'number' && typeof benchDict[d] === 'number' && benchDict[d] > 0)
    .sort((a, b) => a.localeCompare(b));

  const ratios = commonDates.map(d => fundDict[d] / benchDict[d]);
  const zLookup = {};

  for (let i = 0; i < commonDates.length; i++) {
    if (i + 1 < windowSize) continue;
    const slice = ratios.slice(i + 1 - windowSize, i + 1);
    const mean = slice.reduce((acc, v) => acc + v, 0) / windowSize;
    const variance = slice.reduce((acc, v) => acc + (v - mean) * (v - mean), 0) / windowSize;
    const std = Math.sqrt(variance);
    zLookup[commonDates[i]] = std > 1e-12 ? (ratios[i] - mean) / std : 0;
  }
  return zLookup;
}

function renderAll() {
  if (!rawData) return;
  const start = currentStartDate;
  const end = currentEndDate;

  document.getElementById('klineTitle').innerText = `三檔基金淨值總覽（目前焦點：${activeFund}）`;
  const ratioTitleEl = document.getElementById('ratioTitle');
  if (ratioTitleEl) {
    ratioTitleEl.innerText = `${activeFund} — 相對強弱比值指數（基準日 = 100，放大圖表自動以畫面起點重算）`;
  }
  const zscoreTitleEl = document.getElementById('zscoreTitle');
  if (zscoreTitleEl) {
    zscoreTitleEl.innerText = `${activeFund} — 相對強弱比值 60 日滾動 Z-Score（±2σ 偏離度指標）`;
  }

  const unionDateSet = new Set();
  for (const fName of Object.keys(TOP_FUND_CONFIG)) {
    const dObj = rawData.funds[fName] || {};
    for (const d of Object.keys(dObj)) {
      if (d >= start && d <= end) unionDateSet.add(d);
    }
  }
  const alignedDates = Array.from(unionDateSet).sort((a, b) => a.localeCompare(b));
  currentAlignedDates = alignedDates;

  const latestFundValues = {};
  for (const fName of Object.keys(TOP_FUND_CONFIG)) {
    const fDict = rawData.funds[fName] || {};
    topFundSeriesMap[fName].setData(toAlignedNavSeries(fDict, alignedDates));
    const validDatesForFund = alignedDates.filter(d => fDict[d] !== undefined);
    if (validDatesForFund.length > 0) {
      latestFundValues[fName] = fDict[validDatesForFund.at(-1)];
    }
  }
  updateLeftFundLegendOverlay(latestFundValues);

  const activeDict = rawData.funds[activeFund] || {};
  const allSortedActive = Object.entries(activeDict).sort((a, b) => a.at(0).localeCompare(b.at(0)));
  const filteredActiveEntries = allSortedActive.filter(([d]) => d >= start && d <= end);

  const activeScaleId = TOP_FUND_CONFIG[activeFund].priceScaleId;
  const patternTags = detectAndDrawPatterns(filteredActiveEntries, activeScaleId) || {};

  const dict00935 = rawData.benchmarks['00935'] || {};
  const dict2330 = rawData.benchmarks['台積電(2330)'] || {};
  const dictTwii = rawData.benchmarks['加權指數'] || {};

  const compLookups = {
    '運籌': buildMultiAssetReturnLookup(rawData.funds['野村台灣運籌']),
    '優質': buildMultiAssetReturnLookup(rawData.funds['野村優質(累積)']),
    '樂活': buildMultiAssetReturnLookup(rawData.funds['施羅德台灣樂活A']),
    '935': buildMultiAssetReturnLookup(dict00935)
  };

  // 計算圖一三條比值線的 60 日滾動 Z-Score
  const zLookup00935 = buildRollingZScoreLookup(activeDict, dict00935, 60);
  const zLookup2330 = buildRollingZScoreLookup(activeDict, dict2330, 60);
  const zLookupTwii = buildRollingZScoreLookup(activeDict, dictTwii, 60);

  currentRawRatioMaps = { ratio_00935: {}, ratio_2330: {}, ratio_twii: {} };
  for (const d of alignedDates) {
    const fNav = activeDict[d];
    if (fNav !== undefined) {
      if (dict00935[d] > 0) currentRawRatioMaps.ratio_00935[d] = fNav / dict00935[d];
      if (dict2330[d] > 0) currentRawRatioMaps.ratio_2330[d] = fNav / dict2330[d];
      if (dictTwii[d] > 0) currentRawRatioMaps.ratio_twii[d] = fNav / dictTwii[d];
    }
  }

  currentMetricsMap = {};
  const zSeries00935 = [], zSeries2330 = [], zSeriesTwii = [];

  alignedDates.forEach((d) => {
    const zA = zLookup00935[d];
    const zB = zLookup2330[d];
    const zC = zLookupTwii[d];

    zSeries00935.push(zA !== undefined ? { time: d, value: zA } : { time: d });
    zSeries2330.push(zB !== undefined ? { time: d, value: zB } : { time: d });
    zSeriesTwii.push(zC !== undefined ? { time: d, value: zC } : { time: d });

    currentMetricsMap[d] = {
      nav: activeDict[d],
      comp: {
        '運籌': compLookups['運籌'][d],
        '優質': compLookups['優質'][d],
        '樂活': compLookups['樂活'][d],
        '935': compLookups['935'][d]
      },
      ratioA: undefined,
      ratioB: undefined,
      ratioC: undefined,
      z00935: zA,
      z2330: zB,
      zTwii: zC,
      patternTag: patternTags[d] || ''
    };
  });

  recalculateRatioChartForVisibleRange(null);

  zscoreSeriesMap['z_00935'].setData(zSeries00935);
  zscoreSeriesMap['z_2330'].setData(zSeries2330);
  zscoreSeriesMap['z_twii'].setData(zSeriesTwii);

  ratioChart.timeScale().fitContent();
  klineChart.timeScale().fitContent();
  zscoreChart.timeScale().fitContent();
}

async function boot() {
  initCharts();
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (!res.ok) {
      showError('⚠️ 尚未找到 <b>data.json</b> 資料檔！請先到 GitHub 倉庫的 <b>Actions</b> 分頁手動執行一次 <b>Run workflow</b> 產生數據，再重新整理此網頁。');
      return;
    }
    rawData = await res.json();
    const updEl = document.getElementById('updateTime');
    if (updEl) updEl.innerText = '最後更新：' + rawData.updated_at;
    selectActiveFund('野村優質(累積)');
  } catch (err) {
    showError('⚠️ 載入資料發生錯誤：' + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (typeof LightweightCharts === 'undefined') {
    showError('⚠️ 圖表繪製元件載入失敗，請檢查網路連線或按 Ctrl + Shift + R 重新整理。');
    return;
  }
  boot();
});
