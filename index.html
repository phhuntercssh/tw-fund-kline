<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主動型基金偽K線與大盤/台積電/00935超額報酬對比系統</title>
  <script src="./lightweight-charts.js?v=4.1.3-npm03"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #1e222d; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; }
    select, input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; padding: 6px 10px; border-radius: 4px; font-size: 14px; }
    button { background: #2962ff; border: none; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #1e53e5; }
    .chart-title { font-size: 15px; font-weight: bold; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .chart-box { width: 100%; border-radius: 8px; overflow: hidden; background: #1e222d; }
    #kline-chart { height: 340px; }
    #compare-chart { height: 300px; }
    #spread-chart { height: 300px; }
    .legend { font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
    .note { font-size: 12px; color: #787b86; }
    #statusBanner { display: none; background: #3b2322; color: #ff8a80; border: 1px solid #ef5350; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>

<div id="statusBanner"></div>

<div class="toolbar">
  <label>選擇基金：
    <select id="fundSelect">
      <option value="野村台灣運籌">野村台灣運籌</option>
      <option value="野村優質(累積)">野村優質(累積)</option>
      <option value="施羅德台灣樂活A">施羅德台灣樂活A</option>
    </select>
  </label>

  <label>K線週期：
    <select id="timeframeSelect">
      <option value="D">日 K（開=昨收 / 收=今收）</option>
      <option value="W">週 K（週一開 / 週五收）</option>
      <option value="M">月 K（月初開 / 月底收）</option>
    </select>
  </label>

  <label>起始日：<input type="date" id="startDate" value="2020-01-01" min="2010-01-01" /></label>
  <label>結束日：<input type="date" id="endDate" /></label>
  <button onclick="renderAll()">套用區間與週期</button>
  <span id="updateTime" class="note" style="margin-left:auto;"></span>
</div>

<div class="chart-title">
  <span id="klineTitle">基金淨值 K 線圖</span>
  <span class="note">紅漲綠跌（台股慣例）｜三張圖表時間軸與十字游標完全同步聯動</span>
</div>
<div id="kline-chart" class="chart-box"></div>

<div class="chart-title">
  <span>區間累計漲跌幅（%）對比 — 以設定「起始日」為 0% 基準</span>
  <div class="legend">
    <span style="color:#ff9800;">● 選定基金</span>
    <span style="color:#2962ff;">● 加權指數</span>
    <span style="color:#e91e63;">● 台積電(2330)</span>
    <span style="color:#00bcd4;">● 00935</span>
  </div>
</div>
<div id="compare-chart" class="chart-box"></div>

<div class="chart-title">
  <span>超額報酬差值（Alpha Spread %）— 數值大於 0% 代表基金跑贏對照標的</span>
  <div class="legend">
    <span style="color:#4caf50;">● 基金漲跌幅 − 大盤漲跌幅</span>
    <span style="color:#ab47bc;">● 基金漲跌幅 − 台積電漲跌幅</span>
    <span style="color:#ffd54f;">● 基金漲跌幅 − 00935漲跌幅</span>
  </div>
</div>
<div id="spread-chart" class="chart-box"></div>

<script>
let rawData = null;
let klineChart, candleSeries, compareChart, spreadChart;
let lineSeriesMap = {};
let spreadSeriesMap = {};

// 儲存目前畫面上各序列的完整資料（供跨圖表滑鼠懸停 Tooltip 查詢）
let currentSeriesData = {
  candles: {},
  compare: { fund: {}, '加權指數': {}, '台積電(2330)': {}, '00935': {} },
  spread: { diff_twii: {}, diff_2330: {}, diff_00935: {} }
};

document.getElementById('endDate').value = new Date().toISOString().split('T').at(0);

function showError(msg) {
  const banner = document.getElementById('statusBanner');
  banner.style.display = 'block';
  banner.innerHTML = msg;
}

function initCharts() {
  const commonOptions = {
    layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
    timeScale: { timeVisible: false, borderColor: '#485c7b', rightOffset: 5 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
  };

  // 1. 淨值 K 線圖
  klineChart = LightweightCharts.createChart(document.getElementById('kline-chart'), commonOptions);
  candleSeries = klineChart.addCandlestickSeries({
    upColor: '#ef5350', downColor: '#26a69a',
    borderUpColor: '#ef5350', borderDownColor: '#26a69a',
    wickUpColor: '#ef5350', wickDownColor: '#26a69a'
  });

  // 2. 績效百分比比較圖
  compareChart = LightweightCharts.createChart(document.getElementById('compare-chart'), {
    ...commonOptions,
    localization: { priceFormatter: p => p.toFixed(2) + '%' }
  });
  const colors = { fund: '#ff9800', '加權指數': '#2962ff', '台積電(2330)': '#e91e63', '00935': '#00bcd4' };
  for (const [key, color] of Object.entries(colors)) {
    lineSeriesMap[key] = compareChart.addLineSeries({ color, lineWidth: key === 'fund' ? 3 : 2 });
  }

  // 3. 超額報酬價差圖
  spreadChart = LightweightCharts.createChart(document.getElementById('spread-chart'), {
    ...commonOptions,
    localization: { priceFormatter: p => (p >= 0 ? '+' : '') + p.toFixed(2) + '%' }
  });
  const spreadColors = {
    'diff_twii': '#4caf50',
    'diff_2330': '#ab47bc',
    'diff_00935': '#ffd54f'
  };
  for (const [key, color] of Object.entries(spreadColors)) {
    spreadSeriesMap[key] = spreadChart.addLineSeries({ color, lineWidth: 2 });
  }
  spreadSeriesMap['diff_twii'].createPriceLine({
    price: 0,
    color: '#787b86',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: '0% 基準'
  });

  // 三張圖表「實際日期時間軸」100% 垂直同步
  const charts = [klineChart, compareChart, spreadChart];
  let isSyncingTime = false;

  charts.forEach((sourceChart, idx) => {
    sourceChart.timeScale().subscribeVisibleTimeRangeChange(timeRange => {
      if (isSyncingTime || !timeRange) return;
      isSyncingTime = true;
      charts.forEach((targetChart, targetIdx) => {
        if (idx !== targetIdx) {
          try {
            targetChart.timeScale().setVisibleRange(timeRange);
          } catch (e) {}
        }
      });
      isSyncingTime = false;
    });
  });

  // 滑鼠移動點上「三圖同步十字準線 ＋ 顯示完整數值浮動框」
  const tooltip = document.createElement('div');
  tooltip.style.cssText = `
    position: fixed; display: none; pointer-events: none; z-index: 9999;
    background: rgba(24, 28, 39, 0.94); color: #e0e3eb;
    border: 1px solid #485c7b; border-radius: 6px; padding: 10px 14px;
    font-size: 12.5px; line-height: 1.65; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    min-width: 210px;
  `;
  document.body.appendChild(tooltip);

  const fmtPct = (v) => v !== undefined ? `${v >= 0 ? '+' : ''}${v.toFixed(2)}%` : '--';

  charts.forEach((sourceChart, sourceIdx) => {
    sourceChart.subscribeCrosshairMove(param => {
      if (!param.point || !param.time || param.point.x < 0 || param.point.y < 0) {
        tooltip.style.display = 'none';
        charts.forEach((c, i) => { if (i !== sourceIdx) c.clearCrosshairPosition(); });
        return;
      }

      const dateStr = typeof param.time === 'string'
        ? param.time
        : `${param.time.year}-${String(param.time.month).padStart(2, '0')}-${String(param.time.day).padStart(2, '0')}`;

      if (sourceIdx !== 0 && currentSeriesData.candles[dateStr]) {
        klineChart.setCrosshairPosition(currentSeriesData.candles[dateStr].close, dateStr, candleSeries);
      }
      if (sourceIdx !== 1 && currentSeriesData.compare.fund[dateStr] !== undefined) {
        compareChart.setCrosshairPosition(currentSeriesData.compare.fund[dateStr], dateStr, lineSeriesMap['fund']);
      }
      if (sourceIdx !== 2 && currentSeriesData.spread.diff_twii[dateStr] !== undefined) {
        spreadChart.setCrosshairPosition(currentSeriesData.spread.diff_twii[dateStr], dateStr, spreadSeriesMap['diff_twii']);
      }

      const fundName = document.getElementById('fundSelect').value;
      const candle = currentSeriesData.candles[dateStr];
      const cmp = currentSeriesData.compare;
      const spd = currentSeriesData.spread;

      let html = `<div style="font-weight:bold; font-size:13.5px; color:#fff; border-bottom:1px solid #363a45; padding-bottom:4px; margin-bottom:6px;">📅 ${dateStr}</div>`;

      if (candle) {
        html += `<div style="margin-bottom:6px;">
          <div style="color:#9598a1; font-size:11px;">【${fundName} 淨值】</div>
          <div>收盤：<b>${candle.close.toFixed(2)}</b> <span style="color:#9598a1;">(開 ${candle.open.toFixed(2)})</span></div>
        </div>`;
      }

      html += `<div style="margin-bottom:6px;">
        <div style="color:#9598a1; font-size:11px;">【區間累計報酬】</div>
        <div><span style="color:#ff9800;">●</span> ${fundName}：<b>${fmtPct(cmp.fund[dateStr])}</b></div>
        <div><span style="color:#2962ff;">●</span> 加權指數：<b>${fmtPct(cmp['加權指數'][dateStr])}</b></div>
        <div><span style="color:#e91e63;">●</span> 台積電(2330)：<b>${fmtPct(cmp['台積電(2330)'][dateStr])}</b></div>
        <div><span style="color:#00bcd4;">●</span> 00935：<b>${fmtPct(cmp['00935'][dateStr])}</b></div>
      </div>`;

      html += `<div>
        <div style="color:#9598a1; font-size:11px;">【基金超額報酬差】</div>
        <div><span style="color:#4caf50;">●</span> vs 加權：<b>${fmtPct(spd.diff_twii[dateStr])}</b></div>
        <div><span style="color:#ab47bc;">●</span> vs 台積電：<b>${fmtPct(spd.diff_2330[dateStr])}</b></div>
        <div><span style="color:#ffd54f;">●</span> vs 00935：<b>${fmtPct(spd.diff_00935[dateStr])}</b></div>
      </div>`;

      tooltip.innerHTML = html;
      tooltip.style.display = 'block';

      const mouseX = param.sourceEvent ? param.sourceEvent.clientX : 0;
      const mouseY = param.sourceEvent ? param.sourceEvent.clientY : 0;
      const boxW = 240;
      const boxH = tooltip.offsetHeight || 260;
      const leftPos = (mouseX + boxW + 20 > window.innerWidth) ? (mouseX - boxW - 15) : (mouseX + 16);
      const topPos = (mouseY + boxH + 20 > window.innerHeight) ? Math.max(10, window.innerHeight - boxH - 15) : (mouseY + 16);
      tooltip.style.left = leftPos + 'px';
      tooltip.style.top = topPos + 'px';
    });
  });
}


function aggregateOHLC(entries, timeframe) {
  const dailyCandles = [];
  for (let i = 0; i < entries.length; i++) {
    const date = entries.at(i).at(0);
    const close = entries.at(i).at(1);
    const open = i === 0 ? close : entries.at(i - 1).at(1);
    dailyCandles.push({
      time: date,
      open: open,
      high: Math.max(open, close),
      low: Math.min(open, close),
      close: close
    });
  }
  if (timeframe === 'D') return dailyCandles;

  const grouped = {};
  for (const c of dailyCandles) {
    const d = new Date(c.time);
    let key;
    if (timeframe === 'M') {
      key = c.time.slice(0, 7) + '-01';
    } else {
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      key = monday.toISOString().split('T').at(0);
    }
    if (!grouped[key]) {
      grouped[key] = { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close };
    } else {
      grouped[key].time = c.time;
      grouped[key].high = Math.max(grouped[key].high, c.high);
      grouped[key].low = Math.min(grouped[key].low, c.low);
      grouped[key].close = c.close;
    }
  }
  return Object.values(grouped);
}

function toPctSeries(dict, start, end) {
  const filtered = Object.entries(dict)
    .filter(([d]) => d >= start && d <= end)
    .sort((a, b) => a.at(0).localeCompare(b.at(0)));
  if (filtered.length === 0) return [];
  const base = filtered.at(0).at(1);
  return filtered.map(([d, v]) => ({ time: d, value: ((v - base) / base) * 100 }));
}

function toSpreadSeries(fundDict, benchDict, start, end) {
  const commonDates = Object.keys(fundDict)
    .filter(d => d >= start && d <= end && benchDict[d] !== undefined)
    .sort((a, b) => a.localeCompare(b));
  if (commonDates.length === 0) return [];
  const fundBase = fundDict[commonDates.at(0)];
  const benchBase = benchDict[commonDates.at(0)];
  return commonDates.map(d => {
    const fundPct = ((fundDict[d] - fundBase) / fundBase) * 100;
    const benchPct = ((benchDict[d] - benchBase) / benchBase) * 100;
    return { time: d, value: fundPct - benchPct };
  });
}

function renderAll() {
  if (!rawData) return;
  const fundName = document.getElementById('fundSelect').value;
  const tf = document.getElementById('timeframeSelect').value;
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;

  document.getElementById('klineTitle').innerText = `${fundName} — 淨值 K 線圖`;

  const fundDict = rawData.funds[fundName] || {};
  const filteredEntries = Object.entries(fundDict)
    .filter(([d]) => d >= start && d <= end)
    .sort((a, b) => a.at(0).localeCompare(b.at(0)));

  const candles = aggregateOHLC(filteredEntries, tf);
  candleSeries.setData(candles);
  currentSeriesData.candles = Object.fromEntries(candles.map(c => [c.time, c]));

  const fundPct = toPctSeries(fundDict, start, end);
  lineSeriesMap['fund'].setData(fundPct);
  currentSeriesData.compare.fund = Object.fromEntries(fundPct.map(p => [p.time, p.value]));

  for (const bName of ['加權指數', '台積電(2330)', '00935']) {
    const bPct = toPctSeries(rawData.benchmarks[bName] || {}, start, end);
    lineSeriesMap[bName].setData(bPct);
    currentSeriesData.compare[bName] = Object.fromEntries(bPct.map(p => [p.time, p.value]));
  }

  const spTwii = toSpreadSeries(fundDict, rawData.benchmarks['加權指數'] || {}, start, end);
  const sp2330 = toSpreadSeries(fundDict, rawData.benchmarks['台積電(2330)'] || {}, start, end);
  const sp00935 = toSpreadSeries(fundDict, rawData.benchmarks['00935'] || {}, start, end);

  spreadSeriesMap['diff_twii'].setData(spTwii);
  spreadSeriesMap['diff_2330'].setData(sp2330);
  spreadSeriesMap['diff_00935'].setData(sp00935);

  currentSeriesData.spread.diff_twii = Object.fromEntries(spTwii.map(p => [p.time, p.value]));
  currentSeriesData.spread.diff_2330 = Object.fromEntries(sp2330.map(p => [p.time, p.value]));
  currentSeriesData.spread.diff_00935 = Object.fromEntries(sp00935.map(p => [p.time, p.value]));

  // 統一對齊三張圖的可視日期範圍
  klineChart.timeScale().fitContent();
  const alignedRange = klineChart.timeScale().getVisibleRange();
  if (alignedRange) {
    try {
      compareChart.timeScale().setVisibleRange(alignedRange);
      spreadChart.timeScale().setVisibleRange(alignedRange);
    } catch (e) {
      compareChart.timeScale().fitContent();
      spreadChart.timeScale().fitContent();
    }
  }
}

async function boot() {
  initCharts();
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (!res.ok) {
      showError('⚠️ 尚未找到 <b>data.json</b> 資料檔！請先到 GitHub 倉庫的 <b>Actions</b> 分頁手動執行一次 <b>Run workflow</b> 產生數據，再重新整理此網頁。');
      return;
    }
    rawData = await res.json();
    document.getElementById('updateTime').innerText = '最後更新：' + rawData.updated_at;
    renderAll();
  } catch (err) {
    showError('⚠️ 載入資料發生錯誤：' + err.message);
  }
}

boot();
</script>



  
</body>
</html>
